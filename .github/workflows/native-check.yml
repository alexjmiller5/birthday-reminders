name: Native app checks

on:
  push:
    branches: [main, native-ios]
  pull_request:
    paths: ['ios/**', 'Package.swift', '.github/workflows/*.yml', 'scripts/sign*', 'scripts/ios_workflow_test.py']

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test signing and encrypted artifact delivery
        run: |
          python3 scripts/sign_ios_test.py
          python3 scripts/ios_workflow_test.py
      - name: Test birthday core
        run: swift test --scratch-path "$RUNNER_TEMP/birthday-core"
      - name: Verify core regression sensitivity
        run: python3 scripts/ios-mutation-test.py "$RUNNER_TEMP/birthday-core"
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate native project
        working-directory: ios
        run: '"$(realpath "$(command -v xcodegen)")" generate --spec project.yml'
      - name: Build for iPhone simulator
        working-directory: ios
        run: >-
          xcodebuild -project Birthdays.xcodeproj
          -scheme Birthdays -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/birthday-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Test connection storage and onboarding on simulator
        working-directory: ios
        run: |
          IOS_TEST_DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -project Birthdays.xcodeproj -scheme Birthdays \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/birthday-ios-tests" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            -resultBundlePath "$RUNNER_TEMP/birthday-tests.xcresult" test
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/birthday-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/birthday-tests.xcresult" --output-path "$RUNNER_TEMP/birthday-screenshots"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/birthday-screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 1
