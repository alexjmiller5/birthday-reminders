[project]
name = "birthdays"
version = "0.1.0"
description = "Opt-in birthday reminders sourced from the Notion People DB with iOS push and auto-created tasks"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "life-data",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "modal>=1.0",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.uv.sources]
life-data = { git = "https://github.com/alexjmiller5/life-data.git", rev = "5f23a6efa39c5f010c688a5f6b9f0359b2547c23" }
