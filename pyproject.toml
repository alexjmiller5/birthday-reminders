[project]
name = "birthdays"
version = "0.1.0"
description = "Soma birthday task planning and atomic creation adapter"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "soma",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.uv.sources]
soma = { git = "https://github.com/alexjmiller5/soma.git", rev = "1950bdb22ad8965bcee776ef4051f1665b590aeb" }
