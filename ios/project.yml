name: BirthdayReminders
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
packages:
  BirthdayCore:
    path: ..
targets:
  BirthdayReminders:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BirthdayCore
    settings:
      base:
        BIRTHDAY_BUNDLE_ID: com.example.BirthdayReminders
        PRODUCT_BUNDLE_IDENTIFIER: $(BIRTHDAY_BUNDLE_ID)
        PRODUCT_NAME: BirthdayReminders
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROFILE}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Birthday Reminders
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
  BirthdayRemindersTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BirthdayReminders.Tests
    dependencies:
      - target: BirthdayReminders
      - package: BirthdayCore
  BirthdayRemindersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BirthdayReminders.UITests
    dependencies:
      - target: BirthdayReminders
schemes:
  BirthdayReminders:
    build:
      targets:
        BirthdayReminders: all
    test:
      targets: [BirthdayRemindersTests, BirthdayRemindersUITests]
